name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    name: Firmware (${{ matrix.mcu }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mcu: [F401RE, F446RE]
    steps:
      - uses: actions/checkout@v4
      - name: Install ARM GCC
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Build
        run: make MCU=${{ matrix.mcu }}
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.mcu }}
          path: |
            build/${{ matrix.mcu }}/firmware.elf
            build/${{ matrix.mcu }}/firmware.bin
            build/${{ matrix.mcu }}/firmware.hex
            build/${{ matrix.mcu }}/firmware.map

  tests:
    name: Unit tests and static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Unit tests (ASan + UBSan)
        run: make test
      - name: Unit tests (ThreadSanitizer)
        # На свежих ядрах TSan падает из-за увеличенной рандомизации адресов.
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          make test-tsan
      - name: cppcheck
        run: cppcheck --enable=warning,performance,portability --std=c11 --error-exitcode=1 -q -Isrc src tests

  interop:
    name: Modbus interoperability (minimalmodbus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r tools/requirements.txt
      - name: Simulator + independent Modbus master
        run: make interop
